<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./favicon.png"
      type="image/png"
      sizes="32x32"
    />
    <script
      src="https://kit.fontawesome.com/1564faa686.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../globals.css" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Reviews</title>
  </head>
  <body>
    <main class="grid grid-pi-c">
      <section>
        <div>
          <h1 class="headline">Our Reviews</h1>
          <hr class="divider" />
        </div>
        <article class="card grid grid-pi-c">
          <div class="image-wrapper">
            <img class="img" src="" alt="person" />
          </div>
          <h4 class="author"></h4>
          <p class="role"></p>
          <p class="info"></p>
          <div class="button-group">
            <button class="button left">
              <i class="fa-solid fa-angle-left"></i>
            </button>
            <button class="button right">
              <i class="fa-solid fa-angle-right"></i>
            </button>
          </div>
          <button class="button surprise">Surprise me</button>
        </article>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
