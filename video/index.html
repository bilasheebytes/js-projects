<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./assets/favicon.png"
      type="image/png"
      sizes="32x32"
    />
    <script
      src="https://kit.fontawesome.com/1564faa686.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../globals.css" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Video</title>
  </head>
  <body>
    <div class="loader grid grid-pi-c">
      <img src="./assets/loading.gif" alt="loading" />
    </div>
    <main class="grid grid-pi-c">
      <video class="video" muted autoplay loop>
        <source src="./assets/video.mp4" type="video/mp4" />
      </video>
      <h1 class="headline">Video Project</h1>
      <button class="button switch">
        <span class="icon-play"><i class="fa-solid fa-play"></i></span
        ><span class="icon-pause"><i class="fa-solid fa-pause"></i></span>
      </button>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
